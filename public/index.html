<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Observa-Retro · Plataforma de Acompañamiento Formativo en Práctica Pedagógica III</title>
  <meta name="theme-color" content="#8E151A">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app-root"></div>
  <div id="modal-container"></div>

  <!-- Barra de Audio Sincronizado Fija -->
  <div class="audio-bar-fixed" id="audiobar-fixed" hidden>
    <div class="audio-info">
      <span style="font-size:1.1rem; vertical-align:middle; margin-right:4px;">🎧</span>
      <b id="audio-title-display">Grabación de aula</b>
    </div>
    <audio id="global-audio" controls preload="metadata"></audio>
    <button class="btn min secondary" onclick="window.AudioPlayer.unloadAudio()">Ocultar audio</button>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/audioPlayer.js"></script>
  <script src="/js/reflectionEval.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
